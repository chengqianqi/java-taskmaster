<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - TaskMaster</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .error { color: red; font-size: 14px; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="login-box">
    <h2 style="text-align: center;">🔐 系统登录</h2>
    <div class="error" th:if="${param.error}">用户名或密码错误！</div>
    <form action="/doLogin" method="post">
        <div class="form-group">
            <input type="text" name="username" placeholder="用户名 (admin)" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="密码 (123456)" required>
        </div>
        <button type="submit">登录</button>
    </form>
</div>
</body>
</html>
