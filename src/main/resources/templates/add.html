<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增任务</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .error { color: red; font-size: 12px; margin-top: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    </style>
</head>
<body>
<div class="container">
    <h2>➕ 新增任务</h2>
    <!-- 表单提交到 /add，使用 POST 方法 -->
    <form action="/add" method="post" th:object="${task}">
        <div class="form-group">
            <label>任务标题 (必填)</label>
            <input type="text" th:field="*{title}" placeholder="请输入标题">
            <!-- 错误提示回显 -->
            <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="form-group">
            <label>任务描述</label>
            <textarea th:field="*{description}" rows="4" placeholder="请输入描述"></textarea>
        </div>
        <button type="submit">保存任务</button>
    </form>
    <br>
    <a href="/">返回首页</a>
</div>
</body>
</html>
